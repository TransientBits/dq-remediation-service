[project]
name = "dq-remediation-service"
version = "0.1.0"
description = "SAP Data Quality remediation service"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "azure-servicebus>=7.12.0",
    "fastapi>=0.115.0",
    "neo4j>=5.24.0",
    "openai-agents>=0.1.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dq_remediation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src"]
